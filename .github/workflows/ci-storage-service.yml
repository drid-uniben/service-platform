name: CI - Storage Service

on:
  pull_request:
    paths:
      - "storage-service/**"
      - ".github/workflows/ci-storage-service.yml"
  push:
    branches:
      - main
      - staging
    paths:
      - "storage-service/**"
      - ".github/workflows/ci-storage-service.yml"

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storage-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Lint
        run: ruff check app alembic

      - name: Build
        run: python -m compileall app