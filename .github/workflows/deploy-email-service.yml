name: Deploy Email Service Container

on:
  push:
    branches: [staging]
    paths:
      - "email-service/**"
      - ".github/workflows/deploy-email-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
    name: Build and Push Email Service Image
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: email-service
          file: email-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/email-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/email-service:latest