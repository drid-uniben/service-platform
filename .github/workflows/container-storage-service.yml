name: Container CI - Storage Service

on:
  pull_request:
    paths:
      - "storage-service/**"
      - ".github/workflows/container-storage-service.yml"
  push:
    branches:
      - main
      - staging
    paths:
      - "storage-service/**"
      - ".github/workflows/container-storage-service.yml"

permissions:
  contents: read

jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Dockerfile
        id: dockerfile
        run: |
          if [ -f storage-service/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: storage-service/Dockerfile not found"
          fi

      - name: Set up Docker Buildx
        if: ${{ steps.dockerfile.outputs.exists == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: ${{ steps.dockerfile.outputs.exists == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: storage-service
          file: storage-service/Dockerfile
          push: false
          tags: storage-service:ci