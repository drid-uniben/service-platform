name: Deploy Storage Service Container

on:
  push:
    branches: [staging]
    paths:
      - "storage-service/**"
      - ".github/workflows/deploy-storage-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Storage Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: storage-service
          file: storage-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/storage-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/storage-service:latest