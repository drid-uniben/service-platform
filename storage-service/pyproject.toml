[project]
name = "storage-service"
version = "0.1.0"
description = "Object-storage API built with FastAPI, SQLAlchemy, Alembic, and PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.1",
    "sqlalchemy==2.0.40",
    "alembic==1.15.2",
    "psycopg[binary]==3.2.6",
    "pydantic-settings==2.8.1",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "ruff==0.11.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
