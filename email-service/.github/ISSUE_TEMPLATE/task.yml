name: 'Task / maintenance'
description: Refactors, chores, documentation, CI improvements, and maintenance work.
title: 'task: '
labels:
  - task
body:
  - type: markdown
    attributes:
      value: |
        Use this for maintenance work that is not a bug or feature request.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API
        - email-delivery
        - CI / GitHub Actions
        - docs
        - repo maintenance
        - other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be done?
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: Checklist (optional)
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues to avoid duplicates.
          required: true
